name: Build E-Football Android App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version"
        required: true
        default: "1.0.0"
      build:
        description: "Android build number"
        required: true
        default: "1"
      minimum_build:
        description: "Minimum supported build"
        required: true
        default: "1"
      force_update:
        description: "Force update prompt"
        required: true
        type: boolean
        default: false
      release_notes:
        description: "Release notes"
        required: false
        default: "Performance, security and app improvements"
      distribution:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: \${{ inputs.version }}
      APP_BUILD: \${{ inputs.build }}
      MINIMUM_BUILD: \${{ inputs.minimum_build }}
      FORCE_UPDATE: \${{ inputs.force_update }}
      RELEASE_NOTES: \${{ inputs.release_notes }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build bundled web app
        run: npm run build

      - name: Verify bundled web app
        run: test -f .output/public/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("android/app/build.gradle")
          s = p.read_text()
          version = os.environ["APP_VERSION"]
          build = os.environ["APP_BUILD"]
          s = s.replace("versionCode 1", f"versionCode {build}")
          s = s.replace('versionName "1.0"', f'versionName "{version}"')
          s = s.replace("compileSdk 34", "compileSdk 35")
          s = s.replace("targetSdk 34", "targetSdk 35")
          p.write_text(s)
          PY

      - name: Prepare release signing
        if: \${{ inputs.distribution == 'release' }}
        env:
          KEYSTORE_B64: \${{ secrets.ECB_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: \${{ secrets.ECB_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: \${{ secrets.ECB_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: \${{ secrets.ECB_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ECB_ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ECB_ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ECB_ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ECB_ANDROID_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > android/ecb-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../ecb-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          block = r'''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          android.signingConfigs {
              release {
                  storeFile keystoreProperties["storeFile"] ? rootProject.file(keystoreProperties["storeFile"]) : null
                  storePassword keystoreProperties["storePassword"]
                  keyAlias keystoreProperties["keyAlias"]
                  keyPassword keystoreProperties["keyPassword"]
              }
          }
          '''
          s = s.replace("android {", block + "\nandroid {", 1) if "keystorePropertiesFile" not in s else s
          s = s.replace("buildTypes {", "buildTypes {\n        release { signingConfig signingConfigs.release }", 1)
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        if: \${{ inputs.distribution == 'debug' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK
        if: \${{ inputs.distribution == 'release' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        if: \${{ inputs.distribution == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: efootball-competition-bet-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish signed release
        if: \${{ inputs.distribution == 'release' }}
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          gh release create "v$APP_VERSION" "$APK#E-Football Competition Bet v$APP_VERSION.apk" --title "E-Football Competition Bet v$APP_VERSION" --notes "$RELEASE_NOTES"

      - name: Update release manifest
        if: \${{ inputs.distribution == 'release' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          v = os.environ["APP_VERSION"]
          b = int(os.environ["APP_BUILD"])
          minimum = int(os.environ["MINIMUM_BUILD"])
          force = os.environ["FORCE_UPDATE"].lower() == "true"
          notes = os.environ["RELEASE_NOTES"]
          data = {
            "app": "E-Football Competition Bet",
            "platform": "android",
            "latestVersion": v,
            "latestBuild": b,
            "minimumSupportedVersion": "1.0.0",
            "minimumSupportedBuild": minimum,
            "forceUpdate": force,
            "downloadUrl": f"https://github.com/lomita483-del/efootballcompetitionbetting/releases/download/v{v}/app-release.apk",
            "releaseNotes": [notes] if notes else [],
            "publishedAt": datetime.now(timezone.utc).isoformat()
          }
          Path("public/app-release.json").write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Commit release manifest
        if: \${{ inputs.distribution == 'release' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-release.json
          git commit -m "chore: publish E-Football app v$APP_VERSION" || true
          git push
