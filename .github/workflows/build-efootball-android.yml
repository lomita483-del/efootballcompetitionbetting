name: Build E-Football Android App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version"
        required: true
        default: "1.0.26"
      build:
        description: "Android build number"
        required: true
        default: "27"
      minimum_build:
        description: "Minimum supported build"
        required: true
        default: "1"
      force_update:
        description: "Force update prompt"
        required: true
        type: boolean
        default: false
      release_notes:
        description: "What's new — one item per line"
        required: false
        default: "Admin console scaling; staged release What's New; realtime notifications; optional app download reminder; admin-triggered and force-update releases"
      distribution:
        description: "Build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version }}
      APP_BUILD: ${{ inputs.build }}
      MINIMUM_BUILD: ${{ inputs.minimum_build }}
      FORCE_UPDATE: ${{ inputs.force_update }}
      RELEASE_NOTES: ${{ inputs.release_notes }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare launcher icon
        run: |
          mkdir -p android-shell/app/src/main/res/drawable
          curl -fsSL https://raw.githubusercontent.com/lomita483-del/efootballcompetitionbetting/main/public/icon-512.png \
            -o android-shell/app/src/main/res/drawable/site_logo.png
          test -s android-shell/app/src/main/res/drawable/site_logo.png

      - name: Configure Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("android-shell/app/build.gradle")
          s = p.read_text()
          s = re.sub(r"versionCode \d+", f"versionCode {os.environ['APP_BUILD']}", s, count=1)
          s = re.sub(r"versionName ['\"][^'\"]+['\"]", f"versionName '{os.environ['APP_VERSION']}'", s, count=1)
          p.write_text(s)
          PY

      - name: Prepare permanent release signing key
        if: ${{ inputs.distribution == 'release' }}
        env:
          KEYSTORE_B64: ${{ secrets.ECB_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ECB_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ECB_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ECB_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ECB_ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ECB_ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ECB_ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ECB_ANDROID_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > android-shell/release-key.jks
          test -s android-shell/release-key.jks

      - name: Build debug APK
        if: ${{ inputs.distribution == 'debug' }}
        working-directory: android-shell
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        if: ${{ inputs.distribution == 'release' }}
        working-directory: android-shell
        env:
          ECB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ECB_ANDROID_KEYSTORE_PASSWORD }}
          ECB_ANDROID_KEY_ALIAS: ${{ secrets.ECB_ANDROID_KEY_ALIAS }}
          ECB_ANDROID_KEY_PASSWORD: ${{ secrets.ECB_ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        if: ${{ inputs.distribution == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: efootball-competition-bet-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish signed release
        if: ${{ inputs.distribution == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android-shell/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "public/downloads/efootball-competition-bet-latest.apk"
          gh release create "android-v$APP_VERSION-build$APP_BUILD" "$APK#efootball-competition-bet-v$APP_VERSION-build$APP_BUILD.apk" \
            --title "E-Football Competition Bet v$APP_VERSION (build $APP_BUILD)" \
            --notes "$RELEASE_NOTES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/efootball-competition-bet-latest.apk android-shell/app/build.gradle
          git commit -m "chore: publish Android app v$APP_VERSION build $APP_BUILD" || true
          git push

      - name: Upload signed release artifact
        if: ${{ inputs.distribution == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: efootball-competition-bet-v${{ inputs.version }}-build${{ inputs.build }}
          path: android-shell/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
