name: Verify E-Football Android App

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "capacitor.config.ts"
      - "android-shell/**"
      - ".github/workflows/verify-efootball-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build bundled web app
        run: CAPACITOR_BUILD=1 npm run build

      - name: Verify bundled app
        run: |
          test -d .output/public
          test -f .output/public/_shell.html
          test -n "$(find .output/public -type f -print -quit)"

      - name: Copy bundled web app into Android assets
        run: |
          rm -rf android-shell/app/src/main/assets
          mkdir -p android-shell/app/src/main/assets
          cp -R .output/public/. android-shell/app/src/main/assets/
          cp android-shell/app/src/main/assets/_shell.html android-shell/app/src/main/assets/index.html
          test -f android-shell/app/src/main/assets/index.html

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare website launcher icon
        run: |
          mkdir -p android-shell/app/src/main/res/drawable
          curl -fsSL https://raw.githubusercontent.com/lomita483-del/efootballcompetitionbetting/main/public/icon-512.png \
            -o android-shell/app/src/main/res/drawable/site_logo.png
          test -s android-shell/app/src/main/res/drawable/site_logo.png

      - name: Build standalone Android shell
        working-directory: android-shell
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Android APK
        run: |
          test -f android-shell/app/build/outputs/apk/debug/app-debug.apk
          test -s android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: efootball-competition-bet-test-apk
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
