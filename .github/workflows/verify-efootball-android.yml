name: Verify E-Football Android App

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/verify-efootball-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build bundled web app
        run: CAPACITOR_BUILD=1 npm run build
      - name: Verify bundled app
        run: |
          test -d .output/public
          test -n "$(find .output/public -type f -print -quit)"
      - name: Generate Android project
        run: npx cap add android
      - name: Sync bundled app into Android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: efootball-competition-bet-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
