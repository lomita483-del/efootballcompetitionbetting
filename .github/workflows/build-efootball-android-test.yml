name: Build E-Football Android Test APK
# Release build trigger: mobile WebView scale, updater cache-busting, and build 49 release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-shell/**"
      - "src/routes/dashboard.tsx"
      - "src/routes/index.tsx"
      - "src/styles.css"
      - "src/components/Layout.tsx"
      - "src/styles/user-dashboard-premium.css"
      - ".github/workflows/build-efootball-android-test.yml"

permissions:
  contents: write

concurrency:
  group: android-test-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify persistent signing configuration
        env:
          ECB_ANDROID_KEYSTORE_BASE64: ${{ secrets.ECB_ANDROID_KEYSTORE_BASE64 }}
          ECB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ECB_ANDROID_KEYSTORE_PASSWORD }}
          ECB_ANDROID_KEY_ALIAS: ${{ secrets.ECB_ANDROID_KEY_ALIAS }}
          ECB_ANDROID_KEY_PASSWORD: ${{ secrets.ECB_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ECB_ANDROID_KEYSTORE_BASE64" ] || [ -z "$ECB_ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ECB_ANDROID_KEY_ALIAS" ] || [ -z "$ECB_ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Persistent Android signing secrets are required. Refusing to publish an APK signed with a temporary CI debug key."
            exit 1
          fi
          echo "$ECB_ANDROID_KEYSTORE_BASE64" | base64 --decode > android-shell/release-key.jks
          test -s android-shell/release-key.jks

      - name: Sync exact website launcher image
        run: |
          mkdir -p android-shell/app/src/main/res/drawable
          curl -fsSL "https://raw.githubusercontent.com/lomita483-del/efootballcompetitionbetting/main/public/icon-512.png"             -o android-shell/app/src/main/res/drawable/site_logo.png
          file android-shell/app/src/main/res/drawable/site_logo.png
          test -s android-shell/app/src/main/res/drawable/site_logo.png

      - name: Build signed release APK
        working-directory: android-shell
        env:
          ECB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ECB_ANDROID_KEYSTORE_PASSWORD }}
          ECB_ANDROID_KEY_ALIAS: ${{ secrets.ECB_ANDROID_KEY_ALIAS }}
          ECB_ANDROID_KEY_PASSWORD: ${{ secrets.ECB_ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-shell/app/build/outputs/apk/release/app-release.apk
          rm -f android-shell/release-key.jks

      - name: Sync main before generating release metadata
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Generate What's New from actual release changes
        run: |
          chmod +x scripts/generate-release-notes.sh
          ./scripts/generate-release-notes.sh

      - name: Read app version and release notes
        id: app_version
        run: |
          VERSION=$(grep -o "versionName '[^']*'" android-shell/app/build.gradle | head -1 | cut -d"'" -f2)
          BUILD=$(grep -o "versionCode [0-9]*" android-shell/app/build.gradle | head -1 | awk '{print $2}')
          NOTES=$(jq -c '.whatsNew' android-shell/update-notes.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: efootball-competition-bet-android-test
          path: android-shell/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.app_version.outputs.version }}
          BUILD: ${{ steps.app_version.outputs.build }}
        run: |
          TAG="android-v${VERSION}-build${BUILD}"
          cp android-shell/app/build/outputs/apk/release/app-release.apk efootball-competition-bet-test.apk

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          jq -r '.whatsNew | join("\n")' android-shell/update-notes.json > release-notes.txt
          gh release create "$TAG"             --title "E-Football Competition Bet — Test APK v${VERSION}"             --notes-file release-notes.txt

          echo "Release created: $TAG"
          echo "APK will be published through raw.githubusercontent.com."

      - name: Publish update manifest
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          BUILD="${{ steps.app_version.outputs.build }}"
          APK_PATH="public/downloads/efootball-competition-bet-latest.apk"
          mkdir -p public/downloads
          cp android-shell/app/build/outputs/apk/release/app-release.apk "$APK_PATH"

          APK_BYTES=$(stat -c%s "$APK_PATH")
          if [ "$APK_BYTES" -ge 94371840 ]; then
            echo "::error::APK is too large for the repository raw-file delivery path: $APK_BYTES bytes"
            exit 1
          fi

          APK_URL="https://raw.githubusercontent.com/lomita483-del/efootballcompetitionbetting/main/public/downloads/efootball-competition-bet-latest.apk"

          cat > public/app-release.json <<EOF
          {
            "app": "E-Football Competition Bet",
            "platform": "android",
            "latestVersion": "${VERSION}",
            "latestBuild": ${BUILD},
            "minimumSupportedVersion": "1.0.0",
            "minimumSupportedBuild": 1,
            "forceUpdate": false,
            "downloadUrl": "${APK_URL}",
            "whatsNew": ${{ steps.app_version.outputs.notes }},
            "releaseNotes": ${{ steps.app_version.outputs.notes }},
            "publishedAt": "${{ github.event.head_commit.timestamp }}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-release.json "$APK_PATH"
          git commit -m "chore: publish E-Football Android test update ${VERSION}" || true
          git push origin HEAD:main
