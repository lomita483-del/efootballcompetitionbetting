name: Build E-Football Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-shell/**"
      - ".github/workflows/build-efootball-android-test.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        working-directory: android-shell
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: efootball-competition-bet-android-test
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-shell/app/build/outputs/apk/debug/app-debug.apk efootball-competition-bet-test.apk
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest efootball-competition-bet-test.apk --title "E-Football Competition Bet — Test APK" --notes "Test build 1.0.1 (2). App-local WebView storage is separate from Chrome. Update checking is built in."
      - name: Publish update manifest
        run: |
          cat > public/app-release.json <<'EOF'
          {
            "app": "E-Football Competition Bet",
            "platform": "android",
            "latestVersion": "1.0.1",
            "latestBuild": 2,
            "minimumSupportedVersion": "1.0.0",
            "minimumSupportedBuild": 1,
            "forceUpdate": false,
            "downloadUrl": "https://github.com/lomita483-del/efootballcompetitionbetting/releases/download/test-latest/efootball-competition-bet-test.apk",
            "releaseNotes": ["Android app update: app-local storage and built-in update checking are enabled."],
            "publishedAt": "2026-09-22T22:00:00Z"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-release.json
          git commit -m "chore: publish E-Football Android test update 1.0.1" || true
          git push
