name: Build E-Football Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-shell/**"
      - ".github/workflows/build-efootball-android-test.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        id: build_apk
        continue-on-error: true
        working-directory: android-shell
        run: gradle :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee ../android-build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efootball-android-build-log
          path: android-build.log
      - name: Fail if APK build failed
        if: steps.build_apk.outcome == "failure"
        run: exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: efootball-competition-bet-android-test
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish test APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-shell/app/build/outputs/apk/debug/app-debug.apk efootball-competition-bet-test.apk
          gh release delete test-latest --yes || true
          gh release create test-latest efootball-competition-bet-test.apk --title "E-Football Competition Bet — Test APK" --notes "Private test build. App-local WebView storage is separate from Chrome. Update checking is built in."
