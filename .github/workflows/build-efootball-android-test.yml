name: Build E-Football Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-shell/**"
      - ".github/workflows/build-efootball-android-test.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Prepare Android launcher icon
        run: |
          mkdir -p android-shell/app/src/main/res/mipmap-xxxhdpi
          curl -fsSL "https://raw.githubusercontent.com/lomita483-del/efootballcompetitionbetting/main/public/icon-512.png" -o /tmp/ecb-icon.png
          cp /tmp/ecb-icon.png android-shell/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build APK
        working-directory: android-shell
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Read app version
        id: app_version
        working-directory: android-shell
        run: |
          VERSION=$(grep -o "versionName '[^']*'" app/build.gradle | head -1 | cut -d"'" -f2)
          BUILD=$(grep -o "versionCode [0-9]*" app/build.gradle | head -1 | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: efootball-competition-bet-android-test
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-shell/app/build/outputs/apk/debug/app-debug.apk efootball-competition-bet-test.apk
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest efootball-competition-bet-test.apk --title "E-Football Competition Bet — Test APK v${{ steps.app_version.outputs.version }}" --notes "Test build ${{ steps.app_version.outputs.version }} (${{ steps.app_version.outputs.build }}). Desktop-mode WebView, app-local storage and built-in update checking."
      - name: Publish update manifest
        run: |
          cat > public/app-release.json <<'EOF'
          {
            "app": "E-Football Competition Bet",
            "platform": "android",
            "latestVersion": "${{ steps.app_version.outputs.version }}",
            "latestBuild": ${{ steps.app_version.outputs.build }},
            "minimumSupportedVersion": "1.0.0",
            "minimumSupportedBuild": 1,
            "forceUpdate": false,
            "downloadUrl": "https://github.com/lomita483-del/efootballcompetitionbetting/releases/download/test-latest/efootball-competition-bet-test.apk",
            "releaseNotes": ["Desktop-mode Android app update. App-local storage is preserved and Chrome data is separate."],
            "publishedAt": "2026-09-22T22:00:00Z"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-release.json
          git commit -m "chore: publish E-Football Android test update ${{ steps.app_version.outputs.version }}" || true
          git push
