plugins { id 'com.android.application' }

android {
    namespace 'com.ecb.efootballcompetitionbet'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.ecb.efootballcompetitionbet'
        minSdk 24
        targetSdk 34
        versionCode 49
        versionName '1.0.48'
    }

    signingConfigs {
        release {
            storeFile rootProject.file("release-key.jks")
            storePassword System.getenv("ECB_ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ECB_ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ECB_ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
