plugins { id 'com.android.application' }

android {
    namespace 'com.ecb.efootballcompetitionbet'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.ecb.efootballcompetitionbet'
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName '1.0.11'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; debuggable false }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
